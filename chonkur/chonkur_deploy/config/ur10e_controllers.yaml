/**:
  controller_manager:
    ros__parameters:

      io_and_status_controller:
        type: ur_controllers/GPIOController

      speed_scaling_state_broadcaster:
        type: ur_controllers/SpeedScalingStateBroadcaster

      force_torque_sensor_broadcaster:
        type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      scaled_joint_trajectory_controller:
        type: ur_controllers/ScaledJointTrajectoryController

      forward_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

      forward_position_controller:
        type: position_controllers/JointGroupPositionController

      freedrive_mode_controller:
        type: ur_controllers/FreedriveModeController

      forward_effort_controller:
        type: forward_command_controller/ForwardCommandController

      friction_model_controller:
        type: ur_controllers/FrictionModelController

      # controllers for admittance
      admittance_controller:
        type: admittance_controller/AdmittanceController

      admittance_joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      faked_forces_controller: # only for sim
        type: forward_command_controller/MultiInterfaceForwardCommandController

      # CRISP Controllers
      twist_broadcaster:
        type: crisp_controllers/TwistBroadcaster

      pose_broadcaster:
        type: crisp_controllers/PoseBroadcaster

      gravity_compensation:
        type: crisp_controllers/CartesianController

      cartesian_impedance_controller:
        type: crisp_controllers/CartesianController

      joint_impedance_controller:
        type: crisp_controllers/CartesianController

      enforce_command_limits: false


  speed_scaling_state_broadcaster:
    ros__parameters:
      state_publish_rate: 100.0
      tf_prefix: "$(var tf_prefix)"

  io_and_status_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: $(var tf_prefix)tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: $(var tf_prefix)tool0
      topic_name: ft_data

  joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  scaled_joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
      speed_scaling_interface_name: $(var tf_prefix)speed_scaling/speed_scaling_factor

  forward_velocity_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      interface_name: velocity

  forward_position_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint

  freedrive_mode_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"

  forward_effort_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      interface_name: effort

  friction_model_controller:
    ros__parameters:
      tf_prefix: "$(var tf_prefix)"


  # admittance version of JTC
  admittance_joint_trajectory_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint
      command_interfaces:
        - position
        - velocity
      state_interfaces:
        - position
        - velocity
      command_joints:
        - admittance_controller/$(var tf_prefix)shoulder_pan_joint
        - admittance_controller/$(var tf_prefix)shoulder_lift_joint
        - admittance_controller/$(var tf_prefix)elbow_joint
        - admittance_controller/$(var tf_prefix)wrist_1_joint
        - admittance_controller/$(var tf_prefix)wrist_2_joint
        - admittance_controller/$(var tf_prefix)wrist_3_joint
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        $(var tf_prefix)shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)elbow_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        $(var tf_prefix)wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  # admittance controller
  admittance_controller:
    ros__parameters:
      joints:
        - $(var tf_prefix)shoulder_pan_joint
        - $(var tf_prefix)shoulder_lift_joint
        - $(var tf_prefix)elbow_joint
        - $(var tf_prefix)wrist_1_joint
        - $(var tf_prefix)wrist_2_joint
        - $(var tf_prefix)wrist_3_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      chainable_command_interfaces:
        - position
        - velocity

      kinematics:
        plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
        plugin_package: kinematics_interface
        base: $(var tf_prefix)base_link # Assumed to be stationary
        tip: $(var tf_prefix)grasp_frame
        group_name: $(var tf_prefix)chonkur_grasp
        alpha: 0.0005

      # We must separately specify the name of the base link for the kinematics plugin, as was added in
      # https://github.com/ros-controls/kinematics_interface/blob/2f02ebd1ab16828c346c8ccc12e21bf8ef7a29a7/kinematics_interface_kdl/src/kinematics_interface_kdl.cpp#L51
      # This is redundant, but necessary so that the IK solver for the controller only uses the UR links,
      # and not anything the robot is attached to (e.g. a lift or rail or both!)
      # Unfortunately, as we are still on humble we must compile that interface from source.
      base: $(var tf_prefix)base_link

      ft_sensor:
        name: $(var tf_prefix)tcp_fts_sensor
        frame:
          id: $(var tf_prefix)tool0  # Wrench measurements are in this frame
        filter_coefficient: 0.1

      control:
        frame:
          id: $(var tf_prefix)grasp_frame # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      fixed_world_frame:
        frame:   # Gravity points down (neg. Z) in this frame (Usually: world or base_link)
          id: $(var tf_prefix)base_link # Admittance calcs (displacement etc) are done in this frame. Usually the tool or end-effector

      gravity_compensation:
        frame:
          id: $(var tf_prefix)tool0

        CoG: # specifies the center of gravity of the end effector
          pos:
            - 0.0 # x
            - 0.0 # y
            - 0.0 # z
          force: 0.0 # mass * 9.81

      admittance:
        selected_axes: # starting default to off
          - false # x
          - false # y
          - false # z
          - false # rx
          - false # ry
          - false # rz

        # Having ".0" at the end is MUST, otherwise there is a loading error
        # F = M*a + D*v + S*(x - x_d)
        mass:
          - 15.0 # x
          - 15.0 # y
          - 15.0 # z
          - 2.5 # rx
          - 2.5 # ry
          - 2.5 # rz

        damping_ratio: # damping can be used instead: zeta = D / (2 * sqrt( M * S ))
          - 3.5 # x
          - 3.5 # y
          - 3.5 # z
          - 1.0 # rx
          - 1.0 # ry
          - 1.0 # rz

        stiffness:
          - 300.0 # x
          - 300.0 # y
          - 300.0 # z
          - 20.0 # rx
          - 20.0 # ry
          - 20.0 # rz

      # general settings
      enable_parameter_update_without_reactivation: true

  faked_forces_controller:
    ros__parameters:
      joint: $(var tf_prefix)tcp_fts_sensor
      interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z

  # CRISP Controllers
  twist_broadcaster:
  ros__parameters:
    joints:
      - $(var tf_prefix)shoulder_pan_joint
      - $(var tf_prefix)shoulder_lift_joint
      - $(var tf_prefix)elbow_joint
      - $(var tf_prefix)wrist_1_joint
      - $(var tf_prefix)wrist_2_joint
      - $(var tf_prefix)wrist_3_joint
    end_effector_frame: $(var tf_prefix)tool0
    base_frame: $(var tf_prefix)base_link

pose_broadcaster:
  ros__parameters:
    joints:
      - $(var tf_prefix)shoulder_pan_joint
      - $(var tf_prefix)shoulder_lift_joint
      - $(var tf_prefix)elbow_joint
      - $(var tf_prefix)wrist_1_joint
      - $(var tf_prefix)wrist_2_joint
      - $(var tf_prefix)wrist_3_joint
    end_effector_frame: $(var tf_prefix)tool0
    base_frame: $(var tf_prefix)base_link

gravity_compensation:
  ros__parameters:
    joints:
      - $(var tf_prefix)shoulder_pan_joint
      - $(var tf_prefix)shoulder_lift_joint
      - $(var tf_prefix)elbow_joint
      - $(var tf_prefix)wrist_1_joint
      - $(var tf_prefix)wrist_2_joint
      - $(var tf_prefix)wrist_3_joint
    end_effector_frame: $(var tf_prefix)tool0
    base_frame: $(var tf_prefix)base_link
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 30.0
      k_rot_y: 30.0
      k_rot_z: 30.0
    nullspace:
      stiffness: 0.0
    use_friction: true
    use_coriolis_compensation: true
    use_local_jacobian: true

joint_impedance_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)shoulder_pan_joint
      - $(var tf_prefix)shoulder_lift_joint
      - $(var tf_prefix)elbow_joint
      - $(var tf_prefix)wrist_1_joint
      - $(var tf_prefix)wrist_2_joint
      - $(var tf_prefix)wrist_3_joint
    end_effector_frame: $(var tf_prefix)tool0
    base_frame: $(var tf_prefix)base_link
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0
    max_delta_tau: 0.5
    nullspace:
      stiffness: 90.0
      projector_type: none
      damping: 35.0
      max_tau: 1200.0
      regularization: 1.0e-06
      weights:
        shoulder_pan_joint.value: 300.0
        shoulder_lift_joint.value: 300.0
        elbow_joint.value: 300.0
        wrist_1_joint.value: 300.0
        wrist_2_joint.value: 300.0
        wrist_3_joint.value: 300.0
    use_friction: false
    use_coriolis_compensation: false
    use_local_jacobian: true
    limit_error: true
    limit_torques: true

cartesian_impedance_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)shoulder_pan_joint
      - $(var tf_prefix)shoulder_lift_joint
      - $(var tf_prefix)elbow_joint
      - $(var tf_prefix)wrist_1_joint
      - $(var tf_prefix)wrist_2_joint
      - $(var tf_prefix)wrist_3_joint
    end_effector_frame: $(var tf_prefix)tool0
    base_frame: $(var tf_prefix)base_link
    filter:
      q: 0.5
      dq: 0.5
      output_torque: 0.5
    task:
      k_pos_x: 600.0
      k_pos_y: 600.0
      k_pos_z: 600.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0
    nullspace:
      stiffness: 0.0
      damping: 0.0
    use_friction: false
    use_coriolis_compensation: true
    use_local_jacobian: true
    limit_torques: false
